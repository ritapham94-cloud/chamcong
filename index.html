<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Gà Mẹt Cẩm Phả</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark, #121212);
      color: var(--text-light, #f1f1f1);
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }
    .login-page {
      position: relative;
      z-index: 10;
      background: var(--bg-card, #1e1e1e);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color, #333);
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-logo {
      font-size: 48px;
      margin-bottom: 10px;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }
    .login-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent-color, #f97316);
      margin: 0 0 5px 0;
    }
    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted, #9ca3af);
      margin: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    .form-control {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color, #333);
      background: var(--bg-input, #2a2a2a);
      color: var(--text-light, #f1f1f1);
      font-size: 16px;
      box-sizing: border-box;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent-color, #f97316);
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--accent-color, #f97316);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-login:hover {
      background: var(--accent-hover, #ea580c);
    }
    .demo-creds {
      margin-top: 25px;
      padding: 15px;
      background: rgba(249, 115, 22, 0.1);
      border-left: 4px solid var(--accent-color, #f97316);
      border-radius: 4px;
      font-size: 13px;
      color: var(--text-muted, #9ca3af);
    }
    .demo-creds strong {
      color: var(--text-light, #f1f1f1);
    }
    
    /* Glow effects & Particles */
    .glow-1 {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      border-radius: 50%;
      z-index: 1;
    }
    .glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.1) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      right: -150px;
      border-radius: 50%;
      z-index: 1;
    }
    .particle {
      position: absolute;
      background: rgba(249, 115, 22, 0.3);
      border-radius: 50%;
      z-index: 1;
      animation: float linear infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  
  <!-- Particles will be generated by JS -->
  <div id="particles"></div>

  <div class="login-page">
    <div class="login-header">
      <div class="login-logo">🍗</div>
      <h1 class="login-title">Gà Mẹt Cẩm Phả</h1>
      <p class="login-subtitle">Hệ thống chấm công & tính lương</p>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập</label>
        <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu</label>
        <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="loginBtn">Đăng nhập</button>
    </form>
    
    <div class="demo-creds">
      <strong>Tài khoản Demo:</strong><br><br>
      • <strong>Admin:</strong> admin / admin123<br>
      • <strong>Nhân viên:</strong> hoa / 123456, nam / 123456, mai / 123456, tung / 123456
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/seed.js"></script>
  
  <script>
    // Generate particles
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 8 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
      particle.style.animationDelay = (Math.random() * 5) + 's';
      particlesContainer.appendChild(particle);
    }

    // Initialize data
    if (typeof seedData === 'function') seedData();

    // Check if already logged in
    if (typeof Auth !== 'undefined') {
      const session = Auth.getSession();
      if (session) {
        if (Auth.isAdmin(session)) {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'attendance.html';
        }
      }
    }

    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!user || !pass) {
        Toast.error('Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đăng nhập...';

      setTimeout(() => {
        const res = Auth.login(user, pass);
        if (res.ok) {
          Toast.success('Đăng nhập thành công!');
          setTimeout(() => {
            if (Auth.isAdmin(res.session)) {
              window.location.href = 'dashboard.html';
            } else {
              window.location.href = 'attendance.html';
            }
          }, 800);
        } else {
          Toast.error(res.message || 'Đăng nhập thất bại');
          btn.disabled = false;
          btn.innerHTML = '<span>Đăng nhập</span> <i class="fas fa-arrow-right"></i>';
        }
      }, 400);
    });</script>
</body>
</html>
